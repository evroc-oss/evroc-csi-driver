name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.

permissions:
  contents: write
  packages: write
  id-token: write  # Required for keyless signing with Cosign

jobs:
  # Build and test the Go binary
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          go test -v -race ./pkg/...

      - name: Build binary
        run: |
          make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: evroc-csi-driver-binary
          path: bin/evroc-csi-driver
          retention-days: 7

  # Build and push Docker image to GHCR
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image with Cosign (keyless)
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          echo "Signing image with digest: ${DIGEST}"
          cosign sign --yes ghcr.io/${{ github.repository }}@${DIGEST}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Attest SBOM
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ghcr.io/${{ github.repository }}@${DIGEST}

      - name: Generate SLSA provenance attestation
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          # Create provenance predicate
          cat > provenance.json <<EOF
          {
            "buildType": "https://github.com/evroc-oss/evroc-csi-driver/blob/main/.github/workflows/release.yml@refs/tags/${{ steps.get_version.outputs.VERSION }}",
            "builder": {
              "id": "https://github.com/actions/runner"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                },
                "entryPoint": ".github/workflows/release.yml"
              }
            },
            "metadata": {
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "buildFinishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": false
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                }
              }
            ]
          }
          EOF

          cosign attest --yes --predicate provenance.json --type slsaprovenance ghcr.io/${{ github.repository }}@${DIGEST}

  # Package Helm chart and create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.16.3'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Update Chart.yaml version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          sed -i "s/^version:.*/version: ${VERSION}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" chart/Chart.yaml

      - name: Package Helm chart
        run: |
          cd chart
          helm package .
          cd ..

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Helm chart package
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          cd chart
          cosign sign-blob --yes evroc-csi-driver-${VERSION}.tgz --bundle evroc-csi-driver-${VERSION}.tgz.bundle
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          REPO=${{ github.repository }}

          # Extract changelog for this version
          if grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            NOTES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '$d')
          else
            NOTES="Release ${VERSION}

          ## What's Changed

          See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details.

          ## Installation

          ### Using Helm (OCI Registry)

          \`\`\`bash
          helm install evroc-csi-driver oci://ghcr.io/${{ github.repository_owner }}/charts/evroc-csi-driver --version ${VERSION#v}
          \`\`\`

          ### Using Helm (GitHub Release)

          \`\`\`bash
          helm install evroc-csi-driver https://github.com/${REPO}/releases/download/${VERSION}/evroc-csi-driver-${VERSION#v}.tgz
          \`\`\`

          ## Container Images

          - \`ghcr.io/${REPO}:${VERSION}\`
          - Signed with Cosign (keyless)
          - SBOM and SLSA provenance attestations available

          ## Verification

          Verify the image signature:

          \`\`\`bash
          cosign verify ghcr.io/${REPO}:${VERSION} \\
            --certificate-identity=https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION} \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          \`\`\`

          Verify the Helm chart signature:

          \`\`\`bash
          cosign verify-blob evroc-csi-driver-${VERSION#v}.tgz \\
            --bundle evroc-csi-driver-${VERSION#v}.tgz.bundle \\
            --certificate-identity=https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION} \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          \`\`\`"
          fi

          # Write to file to handle multiline
          echo "$NOTES" > release_notes.txt

      # GitHub CLI: Creates GitHub release with artifacts
      # Replaced softprops/action-gh-release to comply with org policy
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}

          # Create release with Helm chart and signatures
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.txt \
            chart/evroc-csi-driver-*.tgz \
            chart/evroc-csi-driver-*.tgz.bundle

      - name: Log in to GitHub Container Registry for Helm
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to GHCR OCI registry
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}
          cd chart
          helm push evroc-csi-driver-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
          cd ..
