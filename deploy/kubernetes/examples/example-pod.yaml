---
apiVersion: v1
kind: Pod
metadata:
  name: evroc-test-pod
  namespace: default
spec:
  # Disable service account token auto-mount (not needed for test pod)
  automountServiceAccountToken: false
  # Explicitly set service account (best practice)
  serviceAccountName: default
  # Security context for all containers
  securityContext:
    runAsNonRoot: true
    runAsUser: 101  # nginx user
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: nginx:latest
      volumeMounts:
        - name: data
          mountPath: /data
      command: ["/bin/sh"]
      args:
        - -c
        - |
          echo "Writing to evroc CSI volume..." > /data/test.txt
          cat /data/test.txt
          tail -f /dev/null
      # Container security context
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: false  # nginx needs write access
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: evroc-test-pvc
