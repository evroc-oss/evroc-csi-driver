apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
  namespace: ${NAMESPACE}
spec:
  containers:
  - name: test-container
    image: busybox:latest
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: vol1
      mountPath: /data1
    - name: vol2
      mountPath: /data2
    - name: vol3
      mountPath: /data3
  volumes:
  - name: vol1
    persistentVolumeClaim:
      claimName: ${PVC_NAME_1}
  - name: vol2
    persistentVolumeClaim:
      claimName: ${PVC_NAME_2}
  - name: vol3
    persistentVolumeClaim:
      claimName: ${PVC_NAME_3}
